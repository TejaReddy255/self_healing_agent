[project]
name = "self-healing-agents"
version = "0.1.0"
description = "Agentic self-healing pipeline monitor: control plane, operator console and DQ service."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.64.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra"
markers = [
    "spec(id, *ids): acceptance criteria covered by this test, e.g. spec('S01-AC4')",
    "integration: needs external services (Docker compose)",
    "e2e: full end-to-end scenario",
    "eval: agent/DQ evaluation suite",
    "live: calls real external providers (e.g. Gemini)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Claude Code hook scripts are project tooling owned outside the application code.
extend-exclude = [".claude"]

[tool.ruff.format]
# Never rewrite code examples inside Markdown docs (specs and the source architecture).
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
