# Tool-permission registry (S06, ADR-005). The ONLY classifier of MCP tools: a tool missing here
# is UNCLASSIFIED and unusable (default deny). Changes are reviewed commits plus a restart; an
# invalid file stops startup.
#
# Entry: {server: postgresql|mysql|s3|mongodb, tool, access: read|write, definition_sha256,
#         timeout_s?, max_output_bytes?, notes?}
# definition_sha256 pins the tool's name, description, input schema and annotations
# (backend.mcp.permissions.definition_sha256): any change on the server excludes the tool until the
# pin is reviewed again. Generate candidates with `uv run python tools/mcp_pin.py <url> <server>`.
# S07 added the postgresql and mysql entries; S24 adds s3 and mongodb.
version: 1
tools:
  # --- postgresql (mcp_servers.postgres) ---
