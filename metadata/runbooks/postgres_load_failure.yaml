runbook_id: RB-PG-LOAD-FAILURE
title: Investigate a PostgreSQL load failure
status: ACTIVE
pipeline_ids: [customer_daily_load]
systems: [postgresql]
categories: [DATA_QUALITY, DUPLICATE_DATA, MISSING_PARTITION]
steps:
