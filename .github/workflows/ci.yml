name: ci

on:
  push:
    branches: [main, "slice/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Precompile bytecode at install time so first imports in tests are not slowed down.
      UV_COMPILE_BYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy backend frontend tools
      - name: Unit and contract tests
        run: uv run pytest -m "not integration and not e2e and not live"
      - name: Spec traceability
        run: uv run python tools/trace.py --strict
